{% extends "layout.html" %} {% block title %}Login{% endblock %} {% block body
%}
<div class="auth-container">
  <img
    src="{{ url_for('static', filename='aritbiz_logo.png') }}"
    width="80"
    class="mb-3"
    alt="AritBiz Logo"
  />

  <h2 class="auth-title">AritBiz</h2>
  <p class="auth-subtitle">Sign in to manage your business</p>

  <div class="auth-card">
    <form action="/login" method="post">
      <input
        type="text"
        name="username"
        class="form-control"
        placeholder="Username"
        required
        autofocus
      />

      <input
        type="password"
        name="password"
        class="form-control"
        placeholder="Password"
        required
      />

      <button type="submit" class="btn-auth">Log In</button>
    </form>

    <a href="/register" class="auth-link"> Don’t have an account? Sign up </a>
  </div>
</div>
{% endblock %}
