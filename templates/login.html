{% extends "layout.html" %} {% block body %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AritBiz Management</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>

  <body>
    <div class="auth-container">
      <img
        src="{{ url_for('static', filename='aritbiz_logo.jpg') }}"
        width="80"
        class="mb-3"
      />
      <h2 style="color: var(--brand-teal); font-weight: bold">AritBiz</h2>
      <p class="text-secondary mb-4">Sign in to manage your business</p>

      <div class="auth-card">
        <form action="/login" method="post">
          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Username"
            required
          />
          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Password"
            required
          />
          <button type="submit" class="btn-auth">Log In</button>
        </form>
        <a href="/register" class="auth-link">Don't have an account? Sign up</a>
      </div>
    </div>
  </body>
</html>
{% endblock %}
