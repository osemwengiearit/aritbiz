<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AritBiz Management</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>

  <body>
    <div class="sidebar">
      <a href="/">
        <img
          src="{{ url_for('static', filename='aritbiz_logo.jpg') }}"
          alt="AritBiz Logo"
          width="150"
        />
      </a>

      <div class="brand-name">AritBiz</div>

      <a href="/" class="nav-link">Dashboard</a>
      <a href="/clients" class="nav-link">Clients</a>
      <a href="/projects" class="nav-link">Projects</a>
      <a href="/invoices" class="nav-link">Invoices</a>
      <a href="/analytics" class="nav-link">Analytics</a>

      {% if session.user_id %}
      <a href="/logout" class="nav-link mt-auto">Logout</a>
      {% else %}
      <a href="/login" class="nav-link mt-auto">Login</a>
      {% endif %}
    </div>

    <div class="main-content">{% block body %}{% endblock %}</div>
  </body>
</html>
