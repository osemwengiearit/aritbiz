<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AritBiz{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="icon"
      href="{{ url_for('static', filename='aritbiz_logo.png') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>

  <body>
    {% if request.path not in ['/login', '/register'] %}
    <div class="sidebar">
      <div class="logo-section">
        <img
          src="{{ url_for('static', filename='aritbiz_logo.png') }}"
          class="sidebar-logo"
          alt="AritBiz Logo"
        />
        <h1 class="brand-name">AritBiz</h1>
      </div>

      <div class="nav-links">
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/clients" class="nav-link">Clients</a>
        <a href="/projects" class="nav-link">Projects</a>
        <a href="/invoices" class="nav-link">Invoices</a>
        <a href="/analytics" class="nav-link">Analytics</a>
      </div>

      <div class="bottom-nav">
        {% if session.get("user_id") %}
        <a href="/logout" class="nav-link">Logout</a>
        {% else %}
        <a href="/login" class="nav-link">Login</a>
        {% endif %}
      </div>
    </div>
    {% endif %}

    <div
      class="{% if request.path in ['/login', '/register'] %}auth-page{% else %}main-content{% endif %}"
    >
      {% block body %}{% endblock %}
    </div>
  </body>
</html>
