<!doctype html>
<html lang="en">
  <head>
    <title>AritBiz</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>

  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <img
          src="{{ url_for('static', filename='aritbiz_logo.png') }}"
          class="logo"
        />

        <h2>AritBiz</h2>

        <a href="/">Dashboard</a>
        <a href="/clients">Clients</a>
        <a href="/projects">Projects</a>
        <a href="/invoices">Invoices</a>
        <a href="/analytics">Analytics</a>

        {% if session.user_id %}
        <a href="/logout">Logout</a>
        {% else %}
        <a href="/login">Login</a>
        {% endif %}
      </aside>

      <main class="content">{% block body %}{% endblock %}</main>
    </div>
  </body>
</html>
